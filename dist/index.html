<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Skybound Frontier</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#6d96ae;font-family:Inter,system-ui,sans-serif;color:#fff}canvas{display:block;width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:24px;left:24px}.brand{font-weight:900;font-size:21px;letter-spacing:.08em;text-shadow:0 2px 12px #173d68}.brand b{color:#ffd36a}.coords{margin-top:7px;font:12px ui-monospace,monospace;color:#d8eff7}.hud{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(560px,calc(100%-32px));padding:10px 14px;border:1px solid rgba(255,255,255,.25);border-radius:14px;background:rgba(12,30,49,.64);backdrop-filter:blur(12px);display:flex;align-items:center;gap:12px}.bar{flex:1;height:7px;border-radius:20px;background:rgba(255,255,255,.13);overflow:hidden}.bar i{display:block;width:78%;height:100%;background:#72d5a5}.level{font-size:12px;font-weight:800}.quest{position:absolute;right:24px;top:24px;width:250px;padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.22);background:rgba(12,30,49,.68);backdrop-filter:blur(12px)}.quest small{color:#ffcf70;font-weight:900;letter-spacing:.12em}.quest h2{font-size:16px;margin:8px 0 5px}.quest p{margin:0;font-size:12px;line-height:1.5;color:#d7e5ec}.cross{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(20,42,58,.25)}.compass{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:220px;text-align:center;color:#eef8fa;font:700 11px ui-monospace,monospace;text-shadow:0 1px 8px #173d68}.compass:before{content:'N';position:absolute;left:50%;top:-7px}.controls{position:absolute;left:24px;bottom:82px;padding:8px 10px;border-radius:10px;background:rgba(12,30,49,.5);font-size:11px;line-height:1.7}.toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-20px);padding:10px 16px;border-radius:30px;background:#fff;color:#1b3a52;font-weight:800;opacity:0;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.quest{right:12px;top:12px;width:190px;padding:12px}.top{top:12px;left:12px}.controls{display:none}.hud{bottom:12px}.compass{top:100px}.brand{font-size:16px}}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div class="ui"><div class="top"><div class="brand">SKYBOUND <b>FRONTIER</b></div><div class="coords" id="coords">X 284 · Z 192</div></div><div class="compass">NW &nbsp;&nbsp; 330 &nbsp;&nbsp; N &nbsp;&nbsp; 030 &nbsp;&nbsp; NE</div><div class="quest"><small>ACTIVE QUEST</small><h2>Echoes of the Ridge</h2><p>Find the old observatory beyond the eastern hills.</p></div><div class="cross"></div><div class="controls">WASD / ARROWS · move<br>SHIFT · run · M · map</div><div class="hud"><span class="level">LV 7</span><div class="bar"><i></i></div><span>78%</span></div><div class="toast" id="toast">Checkpoint discovered</div></div>
<script>
const c=document.querySelector('#world'),x=c.getContext('2d');let w,h,t=0,keys={},px=0,pz=0,day=0;
function resize(){w=c.width=innerWidth*dpr();h=c.height=innerHeight*dpr();}const dpr=()=>Math.min(devicePixelRatio||1,2);addEventListener('resize',resize);resize();addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='m')document.querySelector('#toast').classList.add('show')});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

const R=(n)=>((n%1+1)%1)*n;
function terrain(wx,wz){return Math.sin(wx*.018)*34+Math.cos(wz*.021)*27+Math.sin((wx+wz)*.012)*18+Math.sin(wx*.004)*25}
function project(wx,wy,wz){const cx=w*.5,cy=h*.52;const dz=wz/12;let s=(h*.72)/(dz+34);let sx=cx+(wx-px)*s*1.12+Math.sin(t*.00015)*9;let sy=cy-(wy*11)+terrain(wx,wz)*s*.16;return [sx,sy,s]}
function poly(points,fill,stroke){x.beginPath();x.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)x.lineTo(points[i][0],points[i][1]);x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.stroke()}}
function draw(){t=performance.now();let speed=(keys.shift||keys.Shift?3:1.45);if(keys.w||keys.arrowup)pz+=speed;if(keys.s||keys.arrowdown)pz-=speed;if(keys.a||keys.arrowleft)px-=speed;if(keys.d||keys.arrowright)px+=speed;document.querySelector('#coords').textContent=`X ${Math.round(284+px)} · Z ${Math.round(192+pz)}`;
// sky
let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#87b5c9');g.addColorStop(.58,'#c8dbe0');g.addColorStop(1,'#dce2c7');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='rgba(255,244,208,.72)';x.beginPath();x.arc(w*.78,h*.19,Math.min(w,h)*.055,0,Math.PI*2);x.fill();
// distant clouds
for(let i=-1;i<9;i++){let xx=((i*260-t*.004)%((w||1500)+260)+260)%((w||1500)+260)-130;let yy=h*(.16+(i%3)*.035);x.fillStyle='rgba(255,255,255,.22)';x.beginPath();x.ellipse(xx,yy,70,13,0,0,7);x.fill()}
// mountains
for(let layer=0;layer<3;layer++){x.beginPath();x.moveTo(0,h*.61);for(let i=0;i<=20;i++){let xx=i*w/20;let yy=h*(.38+layer*.07)-Math.abs(Math.sin(i*.62+px*.002+layer))*h*(.12-layer*.018)}
}
// simple mountain silhouettes
for(let layer=0;layer<3;layer++){x.beginPath();x.moveTo(0,h*.58+layer*h*.035);for(let i=0;i<=24;i++){let xx=i*w/24;let yy=h*(.48+layer*.065)+Math.sin(i*.75+layer*1.7+px*.0008)*h*(.07-layer*.012);x.lineTo(xx,yy)}x.lineTo(w,h);x.lineTo(0,h);x.closePath();x.fillStyle=['#7c9d9e','#6e8f8c','#5d8175'][layer];x.globalAlpha=.75-layer*.12;x.fill();x.globalAlpha=1}
// ground
x.fillStyle='#58785a';x.beginPath();x.moveTo(0,h*.62);x.lineTo(w,h*.62);x.lineTo(w,h);x.lineTo(0,h);x.fill();
// perspective terrain bands
for(let z=1000;z>20;z-=70){let rel=z-pz*6;if(rel<0)continue;let y=h*.62+(1100-rel)/(1100)*h*.38;let shade=60+Math.floor((rel/1000)*35);x.fillStyle=`rgb(${shade},${shade+20},${shade-5})`;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.lineTo(w,y+18);x.lineTo(0,y+18);x.fill();}
// river
x.beginPath();x.moveTo(w*.30,h*.63);x.bezierCurveTo(w*.40,h*.75,w*.22,h*.84,w*.33,h);x.lineTo(w*.41,h);x.bezierCurveTo(w*.31,h*.86,w*.48,h*.76,w*.37,h*.63);x.closePath();x.fillStyle='#79adad';x.fill();x.strokeStyle='rgba(210,238,229,.55)';x.lineWidth=2;x.stroke();
// trail
x.beginPath();x.moveTo(w*.58,h*.64);x.bezierCurveTo(w*.54,h*.75,w*.65,h*.84,w*.57,h);x.lineTo(w*.69,h);x.bezierCurveTo(w*.75,h*.84,w*.62,h*.75,w*.66,h*.64);x.fillStyle='rgba(190,174,127,.8)';x.fill();
// trees and rocks
for(let i=-12;i<18;i++){let world=i*95-px*1.2;let side=i%3===0?-1:1;let rx=(w*.5+world*.46+side*w*(.22+(Math.abs(i)%5)*.04))% (w*1.3)-w*.15;let rz=300-(i*37+pz*3)%440;if(rz<20)continue;let depth=rz/440,sz=h*(.08+.22*(1-depth));let y=h*(.64+(1-depth)*.28);if(rx<-sz||rx>w+sz)return;drawTree(rx,y,sz,depth)}
// observatory landmark
let ox=w*.68-px*.35,oy=h*.58-pz*.01;x.fillStyle='#b8b0a1';poly([[ox-55,oy+20],[ox+55,oy+20],[ox+38,oy-35],[ox-38,oy-35]],'#bdb59e');poly([[ox-65,oy-35],[ox,oy-82],[ox+65,oy-35]],'#756f63');x.fillStyle='#ddd4b4';x.fillRect(ox-16,oy-32,32,52);x.fillStyle='#f1c86a';x.fillRect(ox-8,oy-20,16,18);
requestAnimationFrame(draw)}
function drawTree(rx,y,sz,depth){x.fillStyle='#4d3f32';x.fillRect(rx-sz*.035,y-sz*.4,sz*.07,sz*.42);x.fillStyle=depth>.55?'#35573a':'#416948';for(let k=0;k<3;k++){x.beginPath();x.moveTo(rx,y-sz*.9+k*sz*.16);x.lineTo(rx-sz*(.22+k*.025),y-sz*.38+k*sz*.12);x.lineTo(rx+sz*(.22+k*.025),y-sz*.38+k*sz*.12);x.closePath();x.fill()}}
requestAnimationFrame(draw);
setTimeout(()=>document.querySelector('#toast').classList.add('show'),900);setTimeout(()=>document.querySelector('#toast').classList.remove('show'),5200);
</script>
</body>
</html>
